
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>动漫插画</title>
  <link rel="stylesheet" href="../css/wallpaper.css">
  <script src="../js/wallpaper.js" defer></script>
</head>
<body>
  <main class="wallpaper-container">
    <a class="back-link" href="art">← 返回文艺详情</a>

    <header class="wallpaper-header">
      <p class="eyebrow">PRIVATE GALLERY</p>
      <h1>动漫插画</h1>
      <p class="subtitle">请耐心等待图片加载哦❤</p>
    </header>

    <section id="password-panel" class="password-panel">
      <form id="password-form">
        <label for="password">访问口令</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          maxlength="256"
          placeholder="请输入口令"
          required
        >
        <button type="submit">验证并进入</button>
        <p id="password-message" role="status"></p>
      </form>
    </section>

    <section id="gallery" class="gallery" hidden>
      <div class="main-image-wrap">
        <img id="main-image" alt="当前壁纸">
      </div>

      <p class="gallery-hint">点击下方缩略图也可以切换主图</p>

      <div id="thumbnails" class="thumbnails"></div>

      <button id="next-button" class="next-button" type="button">
        随机切换下一张
      </button>
    </section>
  </main>
</body>
</html>
