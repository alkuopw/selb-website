<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 流星特效层 -->
  <div class="meteor-field" aria-hidden="true"></div>

  <!-- 汉堡菜单按钮 -->
  <button class="menu-toggle" data-menu-toggle aria-label="打开菜单" aria-expanded="false">
    <span class="menu-toggle__bar">
      <span></span><span></span><span></span>

  <!-- 展开式导航 -->
  <nav class="nav-overlay" data-nav-overlay>

  <header class="hero">
    <h1 class="hero__title">Freesia <em>Hybrida</em></h1>
    <div class="hero__rule"></div>
    <p class="hero__signature" data-signature></p>
    <span class="hero__scroll-hint">Scroll</span>

  <section class="wallpaper">
    <div class="wallpaper__frame">
      <!-- 桌面端显示竖屏壁纸 -->

      <!-- 移动端显示横屏壁纸 -->
      <img class="wallpaper__img wallpaper__img--landscape"
